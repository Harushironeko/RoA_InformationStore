name: world

# 公式サイトの公開データをワールド用に直し、StaffAuth.json と一緒に GitHub Pages へ出す。
# 起動は 公式サイトの publish（配信が終わったら呼ぶ）・このリポジトリへの push・手動。
# 定期実行は呼び出しが届かなかったときの拾い直し（GitHub の都合で遅れたり飛んだりする）
on:
  workflow_dispatch:
    inputs:
      repack:
        description: 画像のマスを詰め直す（消した画像の空きが増えたとき。全シートが読み直しになる）
        type: boolean
        default: false
  push:
    branches: [main]
  schedule:
    - cron: '43 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages

env:
  SOURCE_URL: https://vrcroa.net/data/public.json
  PAGES_URL: https://harushironeko.github.io/RoA_InformationStore

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

      - name: ワールド用に変換する
        env:
          REPACK: ${{ inputs.repack && '1' || '' }}
        run: node world/build.js "$SOURCE_URL" _site/v1 "$PAGES_URL/v1/index.json"

      # 中身（rev）が配信中のものと同じなら出し直さない。push のときはこのリポジトリの中身が変わっているので常に出す
      - name: 変更を確認する
        id: changed
        run: |
          rev() { node -e 'try { console.log(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).rev) } catch { console.log("") }' "$1"; }
          curl -fsS "$PAGES_URL/v1/index.json" -o "$RUNNER_TEMP/live.json" || true
          if [ "$GITHUB_EVENT_NAME" != push ] && [ -n "$(rev "$RUNNER_TEMP/live.json")" ] && [ "$(rev "$RUNNER_TEMP/live.json")" = "$(rev _site/v1/index.json)" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      # 画像を取得してシートを描く。時間がかかるので、配信するときだけ
      - name: 画像のシートを描く
        if: steps.changed.outputs.deploy == 'true'
        run: node world/sheets.js _site/v1

      # これまでの URL（/StaffAuth.json）をそのまま保つ
      - if: steps.changed.outputs.deploy == 'true'
        run: cp StaffAuth.json _site/ && touch _site/.nojekyll
      - if: steps.changed.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - if: steps.changed.outputs.deploy == 'true'
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
